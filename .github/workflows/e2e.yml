# E2E stress test on a fresh Airflow (testcontainers K3s + official Helm chart).
# Manual, and on every push to master. GitLab equivalent: the `e2e` jobs.
#
# Manual run with "compare_cosmos_dbt_ls" also runs the old setup for comparison
# (no manifests, Cosmos runs `dbt ls` while parsing; with and without Cosmos'
# dbt-ls cache), each mode on its own runner and cluster, and writes a
# side-by-side table to the run summary.
name: e2e

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      compare_cosmos_dbt_ls:
        description: "Also run the dbt_ls modes (no manifests) and compare"
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  e2e:
    name: e2e (${{ matrix.mode }})
    runs-on: ubuntu-latest     # 4 vCPU / 16 GB; Docker with privileged containers
    timeout-minutes: 60
    strategy:
      fail-fast: false         # a struggling comparison mode must not cancel the others
      matrix:
        mode: ${{ fromJSON(inputs.compare_cosmos_dbt_ls && '["manifest","dbt_ls","dbt_ls_nocache"]' || '["manifest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements/*.txt}
      - name: Install (dbt venv + test driver)
        run: |
          python -m venv "$RUNNER_TEMP/dbt-venv"
          "$RUNNER_TEMP/dbt-venv/bin/pip" install -q -r requirements/dbt.txt
          pip install -q -r requirements/e2e.txt
          echo "DBT_BIN=$RUNNER_TEMP/dbt-venv/bin/dbt" >> "$GITHUB_ENV"
      - name: E2E stress test (${{ matrix.mode }})
        env:
          E2E_LOAD_MODE: ${{ matrix.mode }}
          E2E_REPORT: build/e2e/report.json
        run: pytest e2e -v -s -p no:cacheprovider
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: "e2e-report-${{ matrix.mode }}", path: build/e2e, retention-days: 14}

  compare:
    if: ${{ always() && inputs.compare_cosmos_dbt_ls }}
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: e2e-report-*, path: build/reports}
      - name: Side-by-side table
        run: |
          python -m e2e.compare build/reports/*/report.json | tee -a "$GITHUB_STEP_SUMMARY"
