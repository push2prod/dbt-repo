# Real Airflow 2.10 strain test: 20 DAGs, 10 running, a 5-DAG deploy under
# load, git-sync swap. ~5 minutes. Run it manually before changing Airflow,
# Cosmos, dbt or git-sync versions or settings. It also runs weekly.
name: strain

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  AIRFLOW_CONSTRAINTS: https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt

jobs:
  strain:
    runs-on: ubuntu-latest   # 4 vCPU: load average ~3x cores during the test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install pinned toolchain (two venvs, like the Airflow image)
        run: |
          python -m venv "$RUNNER_TEMP/dbt-venv"
          "$RUNNER_TEMP/dbt-venv/bin/pip" install -q -r requirements/dbt.txt
          pip install -q -r requirements/airflow.txt -c "$AIRFLOW_CONSTRAINTS"
      - name: Strain test (Postgres binaries are preinstalled on the runner)
        run: python strain/run.py --dbt-venv "$RUNNER_TEMP/dbt-venv" --workdir "$RUNNER_TEMP/strain"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strain-report
          path: |
            ${{ runner.temp }}/strain/report.json
            ${{ runner.temp }}/strain/logs
          retention-days: 14
