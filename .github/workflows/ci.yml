# Pull requests: lint + build the bundle (vs. what is deployed) + validate it.
# GitLab equivalent: .gitlab-ci.yml (lint, validate).
name: ci

on:
  pull_request:
    branches: [master]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  AIRFLOW_CONSTRAINTS: https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt
  DBT_SOURCE: e2e/fixtures   # the dbt content to build; a real dbt repo uses "."
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  commit-hygiene:
    # A "[skip ci]" in a PR commit ends up in the squash commit and silently skips the deploy.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: No skip-ci markers in PR title or commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='\[(skip ci|ci skip|no ci|skip actions|actions skip)\]|skip-checks: *true'
          bad=$( { echo "$TITLE"; git log --format=%B "$BASE..$HEAD"; } | grep -iE "$pattern" || true)
          if [ -n "$bad" ]; then echo "::error::skip-ci marker found:"; echo "$bad"; exit 1; fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements/*.txt}
      # Airflow side with its constraints; test driver + dev tools on top (the
      # constraints pin older ruff/mypy/pre-commit/pyyaml than these need).
      - run: |
          pip install -q -r requirements/airflow.txt -c "$AIRFLOW_CONSTRAINTS"
          pip install -q -r requirements/e2e.txt -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck
      - run: python ci/check_lengths.py

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements/*.txt}
      - name: Install (dbt in its own venv, like the Airflow image)
        run: |
          python -m venv "$RUNNER_TEMP/dbt-venv"
          "$RUNNER_TEMP/dbt-venv/bin/pip" install -q -r requirements/dbt.txt
          pip install -q -r requirements/airflow.txt -c "$AIRFLOW_CONSTRAINTS"
          echo "DBT_BIN=$RUNNER_TEMP/dbt-venv/bin/dbt" >> "$GITHUB_ENV"
          echo "DBT_EXECUTABLE=$RUNNER_TEMP/dbt-venv/bin/dbt" >> "$GITHUB_ENV"
      - name: Previous bundle = current deploy branch (for reuse)
        run: |
          mkdir -p build/previous
          if git fetch -q --depth 1 origin deploy; then git archive FETCH_HEAD | tar -x -C build/previous; fi
      - name: Generate bundle
        run: python -m manifest.generate --source "$DBT_SOURCE" --out build/bundle --previous build/previous
      - name: Validate bundle
        env: {BUNDLE_DIR: build/bundle, AIRFLOW_HOME: "${{ runner.temp }}/airflow"}
        run: pytest
      - uses: actions/upload-artifact@v4
        with: {name: bundle, path: build/bundle, include-hidden-files: true, retention-days: 7}
