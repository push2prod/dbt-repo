# Build the deploy tree from master and publish it to the `deploy` branch,
# which git-sync (or an Airflow 3 GitDagBundle) tracks.
#
# Runs once per push to master, whatever the merge strategy:
#   squash -> 1 new commit, rebase -> N new commits, merge -> merge commit + PR commits.
# Only master's tip is ever deployed. What gets re-parsed is decided by
# diffing against the *deployed* source commit (the Source-Commit trailer on
# deploy), not `HEAD~1` or `github.event.before`. So the number of commits per
# push, skipped or failed runs, and force-pushes don't matter. Consistency and
# races are handled in ci/publish.sh (freshness check + compare-and-swap push).
name: deploy

on:
  push:
    branches: [master]
  # Reconcile: catches a deploy that was skipped (a skip-ci marker in a
  # squash message, a failed run, a direct push). Cheap: only changed projects
  # are re-parsed, and an unchanged tree publishes nothing.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Rebuild every project, ignoring previous builds"
        type: boolean
        default: false

# One deploy at a time. With cancel-in-progress: false, a running publish is
# never killed halfway, and GitHub keeps only the *newest* pending run, so a
# burst of merges collapses into: the current run, then the latest one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Always build master's current tip. A run for an older push that
          # starts late just builds the newer tip (same result as the newer
          # run, which then has nothing to do).
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install pinned toolchain
        run: pip install -r requirements/dbt.txt -r requirements/airflow.txt

      - name: Deployed vs master (before)
        run: bash ci/deploy_status.sh || true

      - name: Build, test, publish (retries if it loses a race)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
        run: bash ci/deploy.sh ${{ inputs.full_rebuild && '--no-reuse' || '' }}

      - name: Deployed vs master (after)
        # Fails only if a deployable change is still missing and this run
        # really built the tip. If master moved during the run, the newer
        # run (queued behind this one) is responsible.
        run: |
          if [ "$(git ls-remote origin refs/heads/master | cut -f1)" = "$(git rev-parse HEAD)" ]; then
            bash ci/deploy_status.sh
          else
            echo "master moved during this run; the next run deploys it"
          fi
