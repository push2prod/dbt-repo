# Push to master: build the bundle, validate it, commit it to the `deploy` branch
# that git-sync tracks. GitLab equivalent: the `deploy` job in .gitlab-ci.yml.
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time; a burst of merges collapses to the newest pending run.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write   # push to `deploy` with the workflow's GITHUB_TOKEN

env:
  PYTHON_VERSION: "3.12"
  AIRFLOW_CONSTRAINTS: https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt
  DBT_SOURCE: e2e/fixtures
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements/*.txt}
      - name: Install (dbt in its own venv, like the Airflow image)
        run: |
          python -m venv "$RUNNER_TEMP/dbt-venv"
          "$RUNNER_TEMP/dbt-venv/bin/pip" install -q -r requirements/dbt.txt
          pip install -q -r requirements/airflow.txt -c "$AIRFLOW_CONSTRAINTS"
          echo "DBT_BIN=$RUNNER_TEMP/dbt-venv/bin/dbt" >> "$GITHUB_ENV"
          echo "DBT_EXECUTABLE=$RUNNER_TEMP/dbt-venv/bin/dbt" >> "$GITHUB_ENV"
      - name: Check out the deploy branch (previous bundle)
        run: |
          if git fetch -q origin deploy; then git worktree add -q -B deploy build/deploy FETCH_HEAD
          else git worktree add -q --orphan -b deploy build/deploy; fi
      - name: Generate bundle (only changed projects re-parsed)
        run: python -m manifest.generate --source "$DBT_SOURCE" --out build/bundle --previous build/deploy
      - name: Validate bundle
        env: {BUNDLE_DIR: build/bundle, AIRFLOW_HOME: "${{ runner.temp }}/airflow"}
        run: pytest
      - name: Commit and push to deploy
        run: |
          if [ "$(git ls-remote origin refs/heads/master | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "master moved on during this run; the newer run deploys"; exit 0
          fi
          cd build/deploy
          git rm -rq --ignore-unmatch .
          cp -a ../bundle/. .
          git add -A -f
          if git diff --cached --quiet; then echo "bundle unchanged; nothing to deploy"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "deploy: ${GITHUB_SHA::12} [skip ci]" -m "Source-Commit: $GITHUB_SHA"
          git push origin deploy
