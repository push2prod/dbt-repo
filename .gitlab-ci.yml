# GitLab pipeline: same steps as .github/workflows/, same scripts.
#
# Project setup:
#   * CI/CD variable DEPLOY_PUSH_TOKEN (masked, protected): a project access token
#     with write_repository, used to push the `deploy` branch (CI_JOB_TOKEN can't push).
#   * Settings > CI/CD > General pipelines > "Prevent outdated deployment jobs": on.
#     With resource_group, an older pipeline can then never deploy over a newer one.
#   * e2e: a runner that allows privileged containers (docker:dind + K3s).

stages: [lint, validate, deploy, e2e]

default:
  image: python:3.12-slim

variables:
  AIRFLOW_CONSTRAINTS: https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt
  DBT_SOURCE: e2e/fixtures          # the dbt content to build; a real dbt repo uses "."
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DBT_BIN: /opt/dbt-venv/bin/dbt
  DBT_EXECUTABLE: /opt/dbt-venv/bin/dbt

cache:
  key: pip-$CI_JOB_NAME
  paths: [.cache/pip]

workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/     # deploy commits
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

.dbt_venv: &dbt_venv
  - apt-get update -qq && apt-get install -y -qq git >/dev/null
  - python -m venv /opt/dbt-venv && /opt/dbt-venv/bin/pip install -q -r requirements/dbt.txt

lint:
  stage: lint
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - pip install -q -r requirements/airflow.txt -c "$AIRFLOW_CONSTRAINTS"
    - pip install -q -r requirements/e2e.txt -r requirements/dev.txt   # newer than the constraints pin
  script:
    - ruff check .
    - ruff format --check .
    - mypy
    - git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck
    - python ci/check_lengths.py

validate:
  stage: validate
  before_script:
    - *dbt_venv
    - pip install -q -r requirements/airflow.txt -c "$AIRFLOW_CONSTRAINTS"
  script:
    - mkdir -p build/previous
    - if git fetch -q --depth 1 origin deploy; then git archive FETCH_HEAD | tar -x -C build/previous; fi
    - python -m manifest.generate --source "$DBT_SOURCE" --out build/bundle --previous build/previous
    - BUNDLE_DIR=build/bundle AIRFLOW_HOME=$(mktemp -d) pytest
  artifacts:
    paths: [build/bundle, build/bundle.summary.json]
    expire_in: 1 week

deploy:
  stage: deploy
  needs: [validate]
  resource_group: deploy
  environment: {name: airflow}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
  script:
    - git remote set-url origin "https://oauth2:${DEPLOY_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - if git fetch -q origin deploy; then git worktree add -q -B deploy build/deploy FETCH_HEAD; else git worktree add -q --orphan -b deploy build/deploy; fi
    - cd build/deploy
    - git rm -rq --ignore-unmatch .
    - cp -a ../bundle/. .
    - git add -A -f
    - if git diff --cached --quiet; then echo "bundle unchanged; nothing to deploy"; exit 0; fi
    - 'git -c user.name="gitlab-ci" -c user.email="gitlab-ci@${CI_SERVER_HOST}" commit -q -m "deploy: ${CI_COMMIT_SHORT_SHA} [skip ci]" -m "Source-Commit: ${CI_COMMIT_SHA}"'
    - git push origin deploy

e2e:
  stage: e2e
  needs: []
  image: python:3.12
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    E2E_REPORT: build/e2e/report.json
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: manual
      allow_failure: true
  timeout: 45m
  before_script:
    - python -m venv /opt/dbt-venv && /opt/dbt-venv/bin/pip install -q -r requirements/dbt.txt
    - pip install -q -r requirements/e2e.txt
  script:
    - pytest e2e -v -s -p no:cacheprovider
  artifacts:
    when: always
    paths: [build/e2e]
    expire_in: 2 weeks

# Comparison with the old setup (no manifests, Cosmos runs `dbt ls` while parsing).
# Manual; each mode on its own job and cluster. Thresholds are recorded, not enforced.
e2e-compare:
  extends: e2e
  rules:
    - when: manual
      allow_failure: true
  parallel:
    matrix:
      - E2E_LOAD_MODE: [manifest, dbt_ls, dbt_ls_nocache]
  variables:
    E2E_REPORT: build/e2e/$E2E_LOAD_MODE/report.json

e2e-compare-table:
  stage: e2e
  needs: [e2e-compare]
  rules:
    - when: manual
      allow_failure: true
  script:
    - python -m e2e.compare build/e2e/*/report.json | tee build/e2e/comparison.md
  artifacts:
    paths: [build/e2e/comparison.md]
