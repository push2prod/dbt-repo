# GitLab pipeline: generate each dbt project's target/manifest.json, validate the
# result, and on the default branch publish it on the `deploy` branch that git-sync
# tracks: `deploy` = the source commit + one commit adding the generated files in
# place (the "overlay": <project>/target/manifest.json, dbt_packages/,
# utils/dbt_factory/projects.json). All tooling is under infra/: config
# infra/dbt_bundle.yml, generator infra/manifest, checks infra/checks, and the
# shell steps in infra/scripts (this file only calls them, as `bash <script>`, so
# they don't depend on the files' exec bit surviving the checkout).
#
# Project setup:
#   * CI/CD variable DEPLOY_PUSH_TOKEN (masked, protected): a project access token
#     with write_repository, used to push the `deploy` branch (CI_JOB_TOKEN can't push).
#   * `deploy` is force-pushed (with a lease) on every deploy: if it is a protected
#     branch, allow force push for the token's role (Settings > Repository >
#     Protected branches).
#   * Settings > CI/CD > General pipelines > "Prevent outdated deployment jobs": on.
#     With resource_group, an older pipeline can then never deploy over a newer one
#     (infra/scripts/publish_deploy.sh also skips when the default branch moved on).

stages: [validate, deploy]

default:
  image: python:3.12-slim

variables:
  AIRFLOW_CONSTRAINTS: https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DBT_BIN: /opt/dbt-venv/bin/dbt
  DBT_EXECUTABLE: /opt/dbt-venv/bin/dbt
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

cache:
  key: pip-$CI_JOB_NAME
  paths: [.cache/pip]

workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/     # deploy commits
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

validate:
  stage: validate
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - python -m venv /opt/dbt-venv && /opt/dbt-venv/bin/pip install -q -r infra/requirements/dbt.txt
    - pip install -q -r infra/requirements/airflow.txt -c "$AIRFLOW_CONSTRAINTS"
  script:
    # `infra.manifest.generate` finds the projects (infra/dbt_bundle.yml), runs
    # `dbt deps` + `dbt parse` for each changed one in a temp copy, and writes only
    # the generated files to build/overlay. Unchanged projects are copied from `deploy`.
    - bash infra/scripts/fetch_previous.sh build/previous
    - python -m infra.manifest.generate --source . --out build/overlay --previous build/previous
    # Validate exactly what `deploy` will commit: this commit's tree + the overlay.
    - bash infra/scripts/assemble_deploy_tree.sh "$CI_COMMIT_SHA" build/overlay build/deploy-tree
    - BUNDLE_DIR=build/deploy-tree SUMMARY_FILE=build/overlay.summary.json AIRFLOW_HOME=$(mktemp -d) pytest -c infra/checks/pytest.ini
  artifacts:
    paths: [build/overlay, build/overlay.summary.json]
    expire_in: 1 week

deploy:
  stage: deploy
  needs: [validate]
  resource_group: deploy
  environment: {name: airflow}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
  script:
    - git remote set-url origin "https://oauth2:${DEPLOY_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    # `deploy` = this commit + one commit adding the generated files, force-pushed
    # with a lease. Skips if the default branch moved on, or if `deploy` already
    # holds exactly this commit + these files.
    - DEPLOY_GIT_NAME=gitlab-ci DEPLOY_GIT_EMAIL="gitlab-ci@${CI_SERVER_HOST}" bash infra/scripts/publish_deploy.sh "$CI_COMMIT_SHA" "$CI_DEFAULT_BRANCH" build/overlay
