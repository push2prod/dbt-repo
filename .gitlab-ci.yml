# GitLab pipeline: build the Airflow bundle (dbt manifests + DAGs), validate it,
# and on the default branch commit it to the `deploy` branch that git-sync tracks.
#
# Project setup:
#   * CI/CD variable DEPLOY_PUSH_TOKEN (masked, protected): a project access token
#     with write_repository, used to push the `deploy` branch (CI_JOB_TOKEN can't push).
#   * Settings > CI/CD > General pipelines > "Prevent outdated deployment jobs": on.
#     With resource_group, an older pipeline can then never deploy over a newer one.

stages: [validate, deploy]

default:
  image: python:3.12-slim

variables:
  AIRFLOW_CONSTRAINTS: https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt
  DBT_SOURCE: "."                   # dir holding projects/, packages/ and dags/
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DBT_BIN: /opt/dbt-venv/bin/dbt
  DBT_EXECUTABLE: /opt/dbt-venv/bin/dbt

cache:
  key: pip-$CI_JOB_NAME
  paths: [.cache/pip]

workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/     # deploy commits
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

validate:
  stage: validate
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - python -m venv /opt/dbt-venv && /opt/dbt-venv/bin/pip install -q -r requirements/dbt.txt
    - pip install -q -r requirements/airflow.txt -c "$AIRFLOW_CONSTRAINTS"
  script:
    # `manifest.generate` runs `dbt deps` + `dbt parse` per changed project and
    # writes target/manifest.json + partial_parse.msgpack into the bundle.
    - mkdir -p build/previous
    - if git fetch -q --depth 1 origin deploy; then git archive FETCH_HEAD | tar -x -C build/previous; fi
    - python -m manifest.generate --source "$DBT_SOURCE" --out build/bundle --previous build/previous
    - BUNDLE_DIR=build/bundle AIRFLOW_HOME=$(mktemp -d) pytest
  artifacts:
    paths: [build/bundle, build/bundle.summary.json]
    expire_in: 1 week

deploy:
  stage: deploy
  needs: [validate]
  resource_group: deploy
  environment: {name: airflow}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
  script:
    - git remote set-url origin "https://oauth2:${DEPLOY_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - if git fetch -q origin deploy; then git worktree add -q -B deploy build/deploy FETCH_HEAD; else git worktree add -q --orphan -b deploy build/deploy; fi
    - cd build/deploy
    - git rm -rq --ignore-unmatch .
    - cp -a ../bundle/. .
    - git add -A -f
    - if git diff --cached --quiet; then echo "bundle unchanged; nothing to deploy"; exit 0; fi
    - 'git -c user.name="gitlab-ci" -c user.email="gitlab-ci@${CI_SERVER_HOST}" commit -q -m "deploy: ${CI_COMMIT_SHORT_SHA} [skip ci]" -m "Source-Commit: ${CI_COMMIT_SHA}"'
    - git push origin deploy
