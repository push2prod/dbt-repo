# Tool config only: this repo is not a Python package.

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import order
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "C4",       # comprehensions
  "N",        # naming
  "ANN",      # every function annotated (type hints are mandatory)
  "RUF",
  "PLE", "PLW",
  "PLR0913",  # too many arguments
]

[tool.ruff.lint.per-file-ignores]
# pytest functions take one argument per fixture they use.
"ci/checks/*" = ["PLR0913"]

[tool.ruff.format]
# `ruff format` is the formatter; CI runs `ruff format --check`.

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# DAG files import `dbt_factory` from dags/ (Airflow puts dags/ on sys.path);
# ci/checks import `conftest` / sibling test modules as top-level modules.
# `manifest` and `e2e` are packages imported from the repo root.
mypy_path = "dags:ci/checks"
explicit_package_bases = true
files = ["ci", "dags", "manifest", "e2e"]

[[tool.mypy.overrides]]
# astronomer-cosmos ships no type information (no py.typed).
module = ["cosmos", "cosmos.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# No type information: the kubernetes client and the docker SDK (e2e).
module = ["kubernetes", "kubernetes.*", "docker", "docker.*"]
ignore_missing_imports = true

# Size limits, enforced by ci/check_lengths.py
[tool.repo-limits]
max-function-lines = 60
max-file-lines = 300
