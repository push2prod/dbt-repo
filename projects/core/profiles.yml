# Non-secret fields come from env vars whose CI values (ci/parse.env) match
# production, so the shipped partial_parse.msgpack is still valid at runtime.
# Only the password uses the DBT_ENV_SECRET_ prefix; dbt leaves those out of
# its parse-state hash.
core:
  target: prod
  outputs:
    prod:
      type: postgres
      host: "{{ env_var('DBT_PG_HOST') }}"
      port: "{{ env_var('DBT_PG_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_PG_USER') }}"
      password: "{{ env_var('DBT_ENV_SECRET_PG_PASSWORD') }}"
      dbname: "{{ env_var('DBT_PG_DBNAME') }}"
      schema: core
      threads: 4
