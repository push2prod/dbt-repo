[pytest]
# Validation checks for the assembled deploy tree, and for the generator.
# Run from the repo root (pytest -c makes this directory the rootdir):
#   python -m infra.manifest.generate --out build/overlay
#   infra/scripts/assemble_deploy_tree.sh HEAD build/overlay build/deploy-tree
#   BUNDLE_DIR=build/deploy-tree SUMMARY_FILE=build/overlay.summary.json pytest -c infra/checks/pytest.ini
testpaths = .
# ../.. = the repo root (import infra.manifest), . = conftest / sibling test modules
pythonpath = ../.. .
addopts = -ra -p no:cacheprovider
