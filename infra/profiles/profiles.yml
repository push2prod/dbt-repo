# Dummy profile for CI only: `dbt parse`, `dbt ls` and `dbt compile` don't
# connect to the warehouse. Airflow tasks don't use this file: Cosmos builds the
# profile from the Airflow connection in infra/dbt_bundle.yml (profile.mapping).
# The profile name and target must match infra/dbt_bundle.yml (profile.name / target),
# and `type` must be the adapter in infra/requirements/dbt.txt.
dbt:
  target: prod
  outputs:
    prod:
      type: trino
      method: none          # no auth: parse/ls/compile never open a connection
      host: ci-dummy
      port: 8080
      user: ci-dummy
      database: ci_dummy    # the Trino catalog
      schema: ci_dummy
      threads: 1
