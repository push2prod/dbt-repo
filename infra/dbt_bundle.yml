# Layout of this repo for infra.manifest.generate (and, through the generated
# utils/dbt_factory/projects.json, for the Airflow DAG factory and the CI checks).
# Every path is relative to the repo root (not to this file). Every key is
# optional; the values below are the defaults (infra/manifest/config.py).

projects:
  # Directories holding a dbt_project.yml. "**" is allowed, e.g. "teams/**".
  # A project is named by `name:` in its dbt_project.yml, which must be unique.
  # Local packages (packages.yml `local:`) are never projects, even if matched.
  include: ["projects/*"]
  exclude: []

profile:
  # One profile for every project. Projects that set `profile:` in
  # dbt_project.yml must use this name.
  name: dbt
  target: prod
  # Dummy profiles.yml for `dbt parse` / `dbt ls` / `dbt compile` in CI. Not deployed.
  ci_profiles_dir: infra/profiles
  # What Airflow tasks use: Cosmos builds the profile from this Airflow connection.
  # Trino without authentication (dbt-trino `method: none`): host, port and login
  # (dbt's `user`) come from the Airflow connection (type "trino", provider
  # apache-airflow-providers-trino); no password. The class is this repo's own
  # (utils/dbt_factory/profiles.py): Cosmos ships no no-auth Trino mapping.
  # With authentication, use a Cosmos mapping instead (same profile_args):
  #   cosmos.profiles.TrinoLDAPProfileMapping         login + password; needs http_scheme: https
  #   cosmos.profiles.TrinoCertificateProfileMapping  client cert/key paths in the
  #                                                   connection extras (certs__client_cert_path, certs__client_key_path)
  #   cosmos.profiles.TrinoJWTProfileMapping          token in the connection extras (jwt__token)
  mapping:
    class: utils.dbt_factory.profiles.TrinoNoAuthProfileMapping
    conn_id: trino_default
    # Extra profile fields the Airflow connection can't carry. Trino needs
    # `database` (the catalog) and `schema`: replace the placeholders. Cosmos maps
    # no `http_scheme`: http for a plain server, https if it has TLS.
    profile_args: {database: your_catalog, schema: your_schema, http_scheme: http}

# Env for `dbt parse` in CI: values for env_var() calls in the projects. Optional.
parse_env: infra/manifest/parse.env

# The deploy commit is this repo's tree plus, next to each project's dbt_project.yml:
#   target/manifest.json, and with `ship` also dbt_packages/ (built in CI, so tasks
#   run no `dbt deps`). `install` ships only the manifest and Cosmos runs `dbt deps`
#   in every task: needs network to the package sources and no `local:` packages.
dbt_packages: ship

dags:
  dir: dags                        # the DAG folder (git-sync subPath): hand-written DAG files only
  # The DAG factory package. DAG files import it by this path as a dotted name
  # (`from utils.dbt_factory import dbt_task_group`): Airflow has the repo root on PYTHONPATH
  # (infra/airflow/values.yaml). The generated projects.json is written into it.
  factory_dir: utils/dbt_factory
  # DAG settings (schedule, start_date, catchup, retries, tags ...) are not
  # configured here: each DAG file sets them on its DAG and its default_args.
