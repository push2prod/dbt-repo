defaults:
  tags: [dbt, product]
dags:
  - dag_id: dbt_product_catalog
    schedule: "0 7 * * *"
    select: ["tag:catalog"]
  - dag_id: dbt_product_pricing
    schedule: "10 7 * * *"
    select: ["tag:pricing"]
  - dag_id: dbt_product_reviews
    schedule: "20 7 * * *"
    select: ["tag:reviews"]
  - dag_id: dbt_product_search
    schedule: "30 7 * * *"
    select: ["tag:search"]
