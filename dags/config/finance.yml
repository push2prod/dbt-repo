# DAGs for the finance project. Each domain is owned by exactly one DAG, so all DAGs
# can run at the same time without two runs rebuilding the same table.
defaults:
  tags: [dbt, finance]
dags:
  - dag_id: dbt_finance_billing
    schedule: "0 3 * * *"
    select: ["tag:billing"]
  - dag_id: dbt_finance_treasury
    schedule: "15 3 * * *"
    select: ["path:models/treasury"]
  - dag_id: dbt_finance_payments
    schedule: "30 3 * * *"
    select: ["+payments_summary"]
  - dag_id: dbt_finance_ledger
    schedule: "45 3 * * *"
    select: ["tag:ledger"]
    exclude: ["tag:deprecated"]
