defaults:
  tags: [dbt, finance]
dags:
  - dag_id: dbt_finance_daily
    schedule: "0 3 * * *"
    select: ["tag:daily"]
    exclude: ["tag:deprecated"]
  - dag_id: dbt_finance_monthly
    schedule: "0 4 1 * *"
    select: ["+tag:monthly"]
  - dag_id: dbt_finance_billing
    schedule: "15 3 * * *"
    select: ["tag:billing"]
  - dag_id: dbt_finance_treasury
    schedule: "45 3 * * *"
    select: ["tag:treasury"]
