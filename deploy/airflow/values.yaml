# Apache Airflow Helm chart values for Airflow 2.10: the parts that matter
# for this repo. Every [scheduler] value below is also what
# strain/run_strain_test.sh runs with.

executor: KubernetesExecutor

images:
  airflow:
    # Image = Airflow 2.10.5 + astronomer-cosmos 1.15.1 (requirements/airflow.txt)
    # plus a separate venv with requirements/dbt.txt at /opt/dbt-venv.
    repository: your-registry/airflow-dbt
    tag: "2.10.5-cosmos1.15.1-dbt1.11.17"

env:
  - name: DBT_EXECUTABLE          # read by dags/dbt_factory
    value: /opt/dbt-venv/bin/dbt

dags:
  gitSync:
    enabled: true
    repo: https://github.com/push2prod/dbt-repo.git
    branch: deploy          # build output only, written by .github/workflows/deploy.yml
    rev: HEAD
    depth: 1
    subPath: dags           # dags_folder = <repo>/dags; projects/ sits next to it
    period: 60s
    # Two different git-syncs with the KubernetesExecutor:
    # * scheduler / DAG processor: a *sidecar* that keeps following `deploy`.
    #   It checks out each revision into its own directory and swaps a symlink
    #   atomically. Fresh checkout = fresh mtimes, which gets changed files
    #   re-parsed right away (see [scheduler] below).
    # * task pods: an *init container* with GITSYNC_ONE_TIME=true
    #   (chart files/pod-template-file.kubernetes-helm-yaml). One shallow clone
    #   of `deploy` at pod start, never updated, so a running task's files
    #   can't change or disappear under it. (With Celery/Local executors they
    #   can: see strain/run.py --executor-model local.)
    # Every task pod clones the deploy branch, so keep it shallow (depth: 1) and
    # the deploy tree small. It holds only dags/, packages/ and projects/.
    env:
      # Keeps the sidecar's previous checkout briefly for a DAG-file parse that
      # is in flight during a swap. Tasks don't depend on it with this executor.
      # Raise it above your longest task if you ever move to Celery.
      - name: GITSYNC_STALE_WORKTREE_TIMEOUT
        value: "10m"
  persistence:
    enabled: false

config:
  scheduler:
    # DAG structure only changes on deploy. Files git-sync rewrites are still
    # picked up within seconds, because with file_parsing_sort_mode =
    # modified_time (the default) Airflow 2.10 skips this interval for any
    # file whose mtime is newer than its last parse
    # (airflow/dag_processing/manager.py, prepare_file_path_queue).
    min_file_process_interval: 600
    file_parsing_sort_mode: modified_time
    dag_dir_list_interval: 120
    # Keep at most cores - 1, so the processor loop and scheduler keep a core.
    parsing_processes: 3
    dag_file_processor_timeout: 120
    standalone_dag_processor: "True"   # parsing load can't starve the scheduler loop
  core:
    dagbag_import_timeout: 60
    # Ceiling for concurrently running task pods (each = one dbt invocation).
    parallelism: 32

dagProcessor:
  enabled: true
  resources:
    # Request real CPU and set no CPU limit: CFS throttling under a tight limit
    # is what made the processor miss heartbeats. A memory limit is fine.
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      memory: 4Gi

workers:
  # With the KubernetesExecutor this is the task *pod* spec: one pod per Cosmos
  # task, i.e. one dbt invocation. Cosmos' partial-parse cache lives in the
  # pod and starts empty, so each task uses the shipped, CI-verified msgpack.
  resources:
    # dbt tasks are the CPU-heavy part. Size here, not on the processor.
    requests:
      cpu: "2"
      memory: 4Gi
