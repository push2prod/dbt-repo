# e2e overrides on top of deploy/airflow/values.yaml (chart 1.16.0, Airflow 2.10.5).
# Runtime values (Postgres address, image, git-sync URL, env) are added by
# e2e/harness/airflow.py. Everything about *parsing* stays as in production.

defaultAirflowTag: "2.10.5"
airflowVersion: "2.10.5"

# Metadata DB is the Postgres testcontainer (data.metadataConnection at runtime).
postgresql: {enabled: false}
statsd: {enabled: false}      # its image is on quay.io; not needed here
redis: {enabled: false}       # Celery only
triggerer: {enabled: false}

# k3s' Helm controller runs `helm install` without hooks waiting on a live cluster.
migrateDatabaseJob: {useHelmHooks: false}
createUserJob: {useHelmHooks: false}

dags:
  gitSync:
    ref: deploy
    branch: deploy
    period: 5s
    env:
      - name: GITSYNC_STALE_WORKTREE_TIMEOUT
        value: "10m"

config:
  api:
    auth_backends: airflow.api.auth.backend.basic_auth
  core:
    dags_are_paused_at_creation: "True"
    max_active_tasks_per_dag: "16"
  webserver:
    workers: "2"
  kubernetes_executor:
    delete_worker_pods_on_failure: "False"   # keep failed task pods for debugging

webserver:
  service:
    type: NodePort
    ports:
      - name: airflow-ui
        port: 8080
        targetPort: 8080
        nodePort: 30080
  resources:
    requests: {cpu: 200m, memory: 1Gi}

# Small requests so a 4-CPU / 16 GB runner fits the control plane plus
# E2E_PARALLELISM task pods. The DAG processor keeps its production sizing
# (deploy/airflow/values.yaml: 2 CPU requested, no CPU limit): that request is
# what protects parsing from the dbt task pods, so the test must not weaken it.
scheduler:
  resources:
    requests: {cpu: 200m, memory: 512Mi}
workers:
  resources:
    requests: {cpu: 50m, memory: 300Mi}
    limits: {memory: 1Gi}
