# DAGs for the product project. Each domain is owned by exactly one DAG, so all DAGs
# can run at the same time without two runs rebuilding the same table.
defaults:
  tags: [dbt, product]
dags:
  - dag_id: dbt_product_catalog
    schedule: "0 5 * * *"
    select: ["tag:catalog"]
  - dag_id: dbt_product_pricing
    schedule: "15 5 * * *"
    select: ["path:models/pricing"]
  - dag_id: dbt_product_reviews
    schedule: "30 5 * * *"
    select: ["+reviews_summary"]
  - dag_id: dbt_product_search
    schedule: "45 5 * * *"
    select: ["tag:search"]
    exclude: ["tag:deprecated"]
